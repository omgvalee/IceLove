<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar Visita — Ice Love</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root {
      --turquoise: #03c2d3;
      --hotpink:   #e93586;
      --primary-blue: #1a365d;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0d2240 0%, #1a365d 40%, #0a9aaa 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(233,53,134,0.15) 0%, transparent 70%);
      top: -100px; right: -80px;
      pointer-events: none;
    }

    /* Card */
    .val-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .val-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(3,194,211,0.15);
      border: 1px solid rgba(3,194,211,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--turquoise);
      margin: 0 auto 1.25rem;
    }

    .val-card h2 {
      color: var(--white);
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
    }

    .val-card .client-name {
      color: var(--turquoise);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .val-card p.sub {
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      margin-bottom: 1.75rem;
    }

    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--white);
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 1rem;
    }
    .form-input::placeholder {
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.1em;
    }
    .form-input:focus { border-color: var(--turquoise); }

    .btn-validar {
      width: 100%;
      background: linear-gradient(135deg, var(--turquoise), #0a9aaa);
      color: var(--white);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(3,194,211,0.35);
    }
    .btn-validar:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(3,194,211,0.5);
    }

    /* Result states */
    .result {
      display: none;
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .result.show { display: block; }

    .result.success {
      background: rgba(3,194,211,0.1);
      border: 1px solid rgba(3,194,211,0.3);
    }
    .result.prize {
      background: rgba(233,53,134,0.1);
      border: 1px solid rgba(233,53,134,0.4);
    }
    .result.error {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .result-emoji { font-size: 3rem; margin-bottom: 0.75rem; display: block; }
    .result h3 { color: var(--white); font-size: 1.2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .result p  { color: rgba(255,255,255,0.65); font-size: 0.88rem; margin-bottom: 1.25rem; }

    .btn-volver {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.8);
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-volver:hover { background: rgba(255,255,255,0.18); color: var(--white); }

    /* Visits counter */
    .visits-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.25rem;
    }
    .visits-num {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--white);
      line-height: 1;
    }
    .visits-label {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      line-height: 1.3;
    }

    @media (max-width: 420px) {
      .val-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- VALIDATION FORM -->
  <div class="val-card" id="formSection">
    <div class="val-icon"><i class="bi bi-qr-code-scan"></i></div>
    <h2>Registrar visita</h2>
    <p class="sub" id="clientLabel">Cargando cliente...</p>

    <input class="form-input" type="password" id="pin"
      placeholder="PIN" maxlength="6" inputmode="numeric">
    <button class="btn-validar" onclick="validarVisita()">
      Confirmar visita
    </button>
  </div>

  <!-- SUCCESS RESULT -->
  <div class="val-card result success" id="resultSuccess">
    <span class="result-emoji">✅</span>
    <h3>¡Visita registrada!</h3>
    <div class="visits-display">
      <span class="visits-num" id="newVisitas">0</span>
      <span class="visits-label">visitas<br>acumuladas</span>
    </div>
    <p id="visitasRestantes"></p>
    <button class="btn-volver" onclick="location.href='index.html'">Volver al inicio</button>
  </div>

  <!-- PRIZE RESULT -->
  <div class="val-card result prize" id="resultPrize">
    <span class="result-emoji">🎉</span>
    <h3>¡Premio ganado!</h3>
    <p>El cliente ha completado 10 visitas.<br>Entrégale su bebida gratis.</p>
    <button class="btn-volver" onclick="location.href='index.html'">Volver al inicio</button>
  </div>

  <!-- ERROR RESULT -->
  <div class="val-card result error" id="resultError">
    <span class="result-emoji">❌</span>
    <h3 id="errorTitle">PIN incorrecto</h3>
    <p id="errorMsg">Verifica el PIN e intenta nuevamente.</p>
    <button class="btn-volver" onclick="resetForm()">Intentar de nuevo</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const clienteID = params.get("id");

    // Pre-load client name
    (async () => {
      if (!clienteID) {
        document.getElementById("clientLabel").textContent = "QR inválido";
        return;
      }
      const { data } = await supabaseClient
        .from("clientes").select("nombre, visitas").eq("id", clienteID).single();
      if (data) {
        document.getElementById("clientLabel").textContent =
          `Cliente: ${data.nombre} · ${data.visitas}/10 visitas`;
      }
    })();

    async function validarVisita() {
      const pin = document.getElementById("pin").value;
      if (!pin) return;

      // Check PIN
      const { data: empleado, error: pinError } = await supabaseClient
        .from("empleados").select("*").eq("pin", pin).eq("activo", true).single();

      if (pinError || !empleado) {
        showError("PIN incorrecto", "Verifica el PIN e intenta nuevamente.");
        return;
      }

      if (!clienteID) {
        showError("ID inválido", "El QR escaneado no es válido.");
        return;
      }

      // Get client
      const { data, error } = await supabaseClient
        .from("clientes").select("*").eq("id", clienteID).single();
      if (error) { showError("Error", "No se encontró el cliente."); return; }

      let nuevasVisitas = data.visitas + 1;
      let premio = false;
      if (nuevasVisitas >= 10) { premio = true; nuevasVisitas = 0; }

      await supabaseClient
        .from("clientes")
        .update({ visitas: nuevasVisitas, premio_disponible: premio })
        .eq("id", clienteID);

      document.getElementById("formSection").style.display = "none";

      if (premio) {
        document.getElementById("resultPrize").classList.add("show");
      } else {
        document.getElementById("newVisitas").textContent = nuevasVisitas;
        const restantes = 10 - nuevasVisitas;
        document.getElementById("visitasRestantes").textContent =
          `Faltan ${restantes} visita${restantes !== 1 ? "s" : ""} para el premio.`;
        document.getElementById("resultSuccess").classList.add("show");
      }
    }

    function showError(title, msg) {
      document.getElementById("formSection").style.display = "none";
      document.getElementById("errorTitle").textContent = title;
      document.getElementById("errorMsg").textContent = msg;
      document.getElementById("resultError").classList.add("show");
    }

    function resetForm() {
      document.getElementById("resultError").classList.remove("show");
      document.getElementById("formSection").style.display = "block";
      document.getElementById("pin").value = "";
    }
  </script>
</body>
</html>
