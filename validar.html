<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Validar Visita - IceLove</title>
</head>
<body>

  <h2>Registrar Visita</h2>

  <div id="contenido">
    <p>Ingresa PIN de empleado:</p>
    <input type="password" id="pin">
    <button onclick="validarVisita()">Registrar</button>
  </div>

  <p id="mensaje"></p>

  <!-- Librería Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Conexión -->
  <script src="js/supabase.js"></script>

  <script>

    const PIN_CORRECTO = "1234"; // luego lo cambiamos

    async function validarVisita() {

    const pinIngresado = document.getElementById("pin").value;

    if (!pinIngresado) {
        alert("Ingresa PIN");
        return;
    }

    // 1️⃣ Validar PIN contra tabla empleados
    const { data: empleado, error: pinError } = await supabaseClient
        .from("empleados")
        .select("*")
        .eq("pin", pinIngresado)
        .eq("activo", true)
        .single();

    if (pinError || !empleado) {
        alert("PIN incorrecto");
        return;
    }

    // 2️⃣ Obtener ID cliente desde URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
        alert("ID inválido");
        return;
    }

    // 3️⃣ Obtener cliente
    const { data, error } = await supabaseClient
        .from("clientes")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {
        alert("Error cliente");
        return;
    }

    let nuevasVisitas = data.visitas + 1;
    let premio = false;

    if (nuevasVisitas >= 10) {
        premio = true;
        nuevasVisitas = 0;
    }

    // 4️⃣ Actualizar visitas
    await supabaseClient
        .from("clientes")
        .update({
        visitas: nuevasVisitas,
        premio_disponible: premio
        })
        .eq("id", id);

    document.getElementById("contenido").style.display = "none";

    document.getElementById("mensaje").innerText =
        premio
        ? "🎉 Premio ganado!"
        : "✅ Visita registrada";

    }

  </script>

</body>
</html>
